name: Propose upstream skill updates
on:
  schedule:
    - cron: '24 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream sources
        run: python3 scripts/sync_upstream_skills.py
      - name: Open reviewable update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Already up to date"
            exit 0
          fi
          BRANCH="chore/upstream-skills-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add skills/ponytail skills/grill-me skills/upstream-lock.json
          git commit -m "chore(skills): sync MIT upstream snapshots"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(skills): review upstream skill updates" \
            --body "Review upstream changes, provenance in skills/upstream-lock.json, and license notices. Do not auto-merge or deploy."
