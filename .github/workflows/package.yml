name: Build Dream package
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin source
        run: python3 scripts/validate_plugin.py
      - name: Package plugin from current commit
        run: |
          python3 scripts/package_plugin.py
          unzip -t dream-plugin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dream-plugin-${{ github.sha }}
          path: dream-plugin.zip
          if-no-files-found: error
